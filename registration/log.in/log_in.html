<html>

            <div class="logo_box">
                <img src="/head.logo.png" alt="">
            </div>
            <h2>Bookie.uz</h2>
        </div>

        <form>
            <div class="input_group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Abdulaziz Abdinazarov" required>
            </div>

            <div class="input_group">
                <label for="email">Email pochta</label>
                <input type="email" id="email" placeholder="abdulaziz001@gmail.com" required>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="social_buttons">
            <button class="social_btn google">
                Google
            </button>
            <button class="social_btn facebook">
                facebook
            </button>
        </div>
    </div>
</body>

</html>
